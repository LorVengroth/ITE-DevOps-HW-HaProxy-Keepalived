## config in file : /etc/keepalived/keepalived.conf

global_defs {
    router_id lb-02
    script_user root
    enable_script_security
}

vrrp_script check_haproxy {
    script "killall -0 haproxy"
    interval 2
    weight -20
    fall 2
    rise 2
}

vrrp_instance VI_1 {
    state BACKUP
    interface enp0s8
    virtual_router_id 51
    priority 100
    advert_int 1

    unicast_src_ip 192.168.56.11
    unicast_peer {
        192.168.56.10
    }

    authentication {
        auth_type PASS
        auth_pass ITE_Pass
    }

    virtual_ipaddress {
        192.168.56.100/24 dev enp0s8
    }

    track_script {
        check_haproxy
    }
}